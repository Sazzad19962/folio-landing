name: Conversion

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: conversion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm test

  docker-smoke:
    name: Docker build + conversion smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: folio:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --name folio -p 8080:8080 folio:ci

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 120); do
            if body=$(curl -fsS http://localhost:8080/api/health 2>/dev/null); then
              echo "Healthy after ${i}s: $body"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' folio)" != "true" ]; then
              echo "Container exited early"
              docker logs folio
              exit 1
            fi
            sleep 1
          done
          echo "Server did not become healthy within 120 s"
          docker logs folio
          exit 1

      - name: Smoke test
        run: bash server/test/smoke.sh http://localhost:8080

      - name: Container logs
        if: always()
        run: docker logs folio || true

      - name: Stop container
        if: always()
        run: docker rm -f folio || true
